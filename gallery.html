<!DOCTYPE html>

    <style>
      /* Gallery Section Styles */
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
        margin: 20px;
      }

      .gallery img {
        width: 100%;
        height: auto;
        cursor: pointer;
        border-radius: 8px;
        transition: transform 0.2s;
      }

      .gallery img:hover {
        transform: scale(1.05);
      }

      /* Lightbox Styles */
      .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .lightbox img {
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
      }

      .lightbox .close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 30px;
        color: white;
        cursor: pointer;
      }

      /* Left and Right Navigation Arrows */
      .lightbox .nav-arrow {
        position: absolute;
        top: 50%;
        font-size: 40px;
        color: white;
        cursor: pointer;
        transform: translateY(-50%);
        padding: 10px;
        background-color: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        user-select: none;
      }

      .lightbox .left-arrow {
        left: 20px;
      }

      .lightbox .right-arrow {
        right: 20px;
      }
    </style>
  </head>

    <!-- JavaScript for Toggling Navigation Links and Lightbox Functionality -->
    <script>
      // Toggle navbar links
      document
        .querySelector(".navbar-toggle")
        .addEventListener("click", function () {
          document.querySelector(".navbar-links").classList.toggle("active");
        });

      // Lightbox functionality
      const galleryImages = document.querySelectorAll(".gallery img");
      const lightbox = document.querySelector(".lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const closeBtn = document.querySelector(".close");
      const leftArrow = document.querySelector(".left-arrow");
      const rightArrow = document.querySelector(".right-arrow");
      let currentIndex = 0;

      // Open lightbox on image click
      galleryImages.forEach((image, index) => {
        image.addEventListener("click", () => {
          currentIndex = index; // Set the current index
          lightbox.style.display = "flex";
          lightboxImg.src = image.src;
        });
      });

      // Close lightbox
      closeBtn.addEventListener("click", () => {
        lightbox.style.display = "none";
      });

      // Navigate to previous image
      leftArrow.addEventListener("click", () => {
        currentIndex =
          (currentIndex - 1 + galleryImages.length) % galleryImages.length; // Loop to last image if at first
        lightboxImg.src = galleryImages[currentIndex].src;
      });

      // Navigate to next image
      rightArrow.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % galleryImages.length; // Loop to first image if at last
        lightboxImg.src = galleryImages[currentIndex].src;
      });

      // Close lightbox on outside click
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          lightbox.style.display = "none";
        }
      });
    </script>
  </body>
